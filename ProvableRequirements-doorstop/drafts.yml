          state stored(i: Item)
          state fresh(i: Item)
          state drifted(i: Item)
          state discarded(i: Item)
          state hold(i: Item)
          state counted_verified(i: Item)
        }
        assume { provenance_recorded(requirement_revision, subject_commit, tool_version) }
        require {
          each i: Item . never (drifted(i) and discarded(i))
          each i: Item . never (counted_verified(i) and not stored(i))
          each i: Item . never (counted_verified(i) and not (hold(i) and fresh(i)))
        }
        strength: model_checked over Model
        evidence: tla+ (bounded: |Item| <= 4)
