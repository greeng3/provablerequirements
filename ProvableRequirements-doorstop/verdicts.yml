    - 'the proof harness provreq generated did not compile — error: called program function `draft::is_stale` in logic context (src/provreq_req014.rs:11:80). Pearlite may only call `#[logic]` functions, and that is an ordinary program function — marking it `#[logic]` is not the fix either, because that removes the item from the program and breaks every call site. Reach it through a `#[logic]` mirror instead, which leaves the function untouched: re-run `verify` with `--draft-semantic`'
