  REQ014:
    id: REQ014
    status: unknown
    basis: null
    reason: inconclusive
    witness: null
    detail:
      - "Kani: inconclusive"
      - the sort `provreq::draft::Draft` cannot be instantiated by Kani — a bounded model checker needs a concrete value for every quantified variable, so a type it cannot enumerate stops the harness before the claim is reached. Nothing is wrong with the binding, the sort, or the claim. Either implement `kani::Arbitrary` for `provreq::draft::Draft` in the subject (an adoption step the subject owns, like a contracts dependency — provreq will not write it for you), or reach this claim through a deductive engine, whose `forall` is logical and needs no value at all
      - "Creusot: inconclusive"
      - "the proof harness provreq generated did not compile — error: called program function `draft::is_stale` in logic context (src/provreq_req014.rs:11:80). Pearlite may only call `#[logic]` functions, and that is an ordinary program function — marking it `#[logic]` is not the fix either, because that removes the item from the program and breaks every call site. Reach it through a `#[logic]` mirror instead, which leaves the function untouched: re-run `verify` with `--draft-semantic`"
      - "Prusti: inconclusive"
      - 'Prusti''s pinned toolchain predates this subject''s dependency graph — its 2023 cargo cannot read a v4 lock file or a dependency declaring `edition = "2024"`. This is a toolchain ceiling, not a missing annotation: Prusti can only verify a subject whose whole dependency graph builds on a 2023 nightly, and upstream has published nothing newer'
