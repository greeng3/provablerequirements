schema: 1
subject_requirements: requirements
# The environment a verdict was proved in (REQ049) — the operator's own stable label, so a
# container rebuild does not read as a changed environment the way a hostname would.
environment: provreq-devcontainer
# Triage's bulk pre-sort provider (REQ012). Pointed at a local Ollama, which is the portable
# default. To use the endpoint actually on your network, export PROVREQ_LLM_BASE_URL (and
# PROVREQ_LLM_MODEL) rather than editing this file — the address of one host on one network is
# not a fact about this project, and a run says when an override is in effect (#225). A keyless
# endpoint needs no credential, and an API key would be named here by env var (api_key_env),
# never inlined.
llm:
  provider: openai-compatible
  base_url: http://localhost:11434/v1
  model: qwen3:32b
# Category-3 (UI/WebDriver) deployment the sole cat-3 requirement drives (#630). provreq dogfoods
# every other engine against itself; this closes the last gap by driving a browser against provreq's
# OWN running web surface. `base_url` is the `provreq serve` deployment under check — a committed
# fact about the subject; `steps` are what the driver does and observes. The grid `endpoint` is
# deliberately omitted: it is a fact about the operator's machine, supplied via `WEBDRIVER_URL`, not
# welded into a committed file. Nothing here is up by default, so the committed verdict is an honest
# `unknown` (a cat-3 verdict exists only while a deployment + grid are live); run it with
# `provreq serve --port 8787` plus a grid (e.g. `docker run -d --network host
# selenium/standalone-chromium`, `--network host` so the containerized browser can reach serve's
# loopback bind) and `WEBDRIVER_URL=http://localhost:4444`.
ui:
  base_url: http://localhost:8787
  steps:
    open_app:
      goto: /
    shows_brand:
      text_present: ProvableRequirements
# Kani bounds for the category-1 ensemble (#117). REQ030's harness folds over a length-3
# `ProofEnsemble`, so every loop exits by the fourth iteration — `default_unwind: 4` is the
# tightest bound that discharges the unwinding assertions (verified: 0/513 checks fail in ~4s).
# Without it CBMC unwinds those iterators unbounded and never returns; the timeout is the backstop
# so a future claim that blows up is cut off instead of running for hours.
kani:
  default_unwind: 4
  timeout_seconds: 300
# Per-requirement cat-1 code root (#483). REQ051's readiness property is proved over the payload-free
# core in `crates/provreq-proofs`, which Creusot can compile whole — the app crate cannot (its ~96
# `#[derive(PartialEq)]` types trip Creusot's `DeepModel` demand, #531). `engine::is_ready` delegates
# to that crate, so the proof is about the readiness provreq actually reports. Kani and Creusot both
# run against it; every non-code world still resolves against the subject.
verify:
  # Per-requirement asserted `cargo test` overrides (#612), winning over a subject-wide `verify.cargo`
  # block the way `verify.crates` wins over `verify.crate`. REQ081's tagged test lives in the member
  # crate `provreq-mcp`, which the subject-level `cargo test <name>` (run in the `provreq` package)
  # does not build — `-p provreq-mcp` reaches it. Without this the honest verdict is a permanent
  # `unknown`, even though the test passes under the subject's own command.
  cargo_overrides:
    REQ081:
      extra_args: ["-p", "provreq-mcp"]
  crates:
    REQ011: crates/provreq-proofs
    REQ024: crates/provreq-proofs
    REQ028: crates/provreq-proofs
    # REQ071's code-drift decision is loop-free, so its Creusot proof is a finite case analysis over
    # the payload-free `Pair` inputs in the leaf (#565); `verdict_store::view` reduces the strings.
    REQ071: crates/provreq-proofs
    # REQ030's outcome fold selects the strongest basis over an arbitrary-length slice, so — like
    # REQ076 — its Creusot proof is a max-over-sequence induction in the leaf (#561), proved unbounded
    # while Kani checks the length-3 bound.
    REQ030: crates/provreq-proofs
    REQ051: crates/provreq-proofs
    # REQ078's verdict-event decision is loop-free, so its Creusot/Verus proof is a finite case
    # analysis over the payload-free presence+equality facts in the leaf (#600); `verify::
    # is_verdict_event` reduces the `(status, basis, correspondence)` string tuples.
    REQ078: crates/provreq-proofs
    # REQ079's test-retirement redundancy is a finite comparison on the 3-rung basis lattice, so its
    # Creusot/Verus proof is a case analysis over the payload-free `RetirePair` in the leaf (#602);
    # `report::recommend_retirements` maps `verdict::Basis` and delegates the decision.
    REQ079: crates/provreq-proofs
    # REQ083's expectsCodeTrace guard is a finite decision over the model bucket and the item's
    # declaration, so its Creusot/Verus proof is a case analysis over the payload-free `GuardCase` in
    # the leaf (#604); `llm::parse_buckets` maps `source::Classification` and delegates.
    REQ083: crates/provreq-proofs
    # REQ043's verdict-axis bucketing is a finite decision over a present verdict's freshness and
    # polarity, so its Creusot/Verus proof is a case analysis over the payload-free `VerdictAxis` in
    # the leaf (#606); `status::coverage` reduces `(view.fresh, view.status == "holds")` and delegates.
    REQ043: crates/provreq-proofs
    # REQ033's marker-draft guard is a finite two-case decision over the dialect's marker, so its
    # Creusot/Verus proof is a case analysis over the payload-free `Marker` in the leaf (#608);
    # `contract_draft::Marker::drafts_markers` maps the app marker and delegates.
    REQ033: crates/provreq-proofs
    # REQ076's masquerade guard folds over an arbitrary-length evidence slice, so unlike the others
    # its Creusot proof is a Seq-induction (loop invariants), proved unbounded in the leaf (#539).
    REQ076: crates/provreq-proofs
