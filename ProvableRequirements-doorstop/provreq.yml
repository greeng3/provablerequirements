schema: 1
subject_requirements: requirements
# The environment a verdict was proved in (REQ049) — the operator's own stable label, so a
# container rebuild does not read as a changed environment the way a hostname would.
environment: provreq-devcontainer
# Triage's bulk pre-sort provider (REQ012). Pointed at a local Ollama, which is the portable
# default. To use the endpoint actually on your network, export PROVREQ_LLM_BASE_URL (and
# PROVREQ_LLM_MODEL) rather than editing this file — the address of one host on one network is
# not a fact about this project, and a run says when an override is in effect (#225). A keyless
# endpoint needs no credential, and an API key would be named here by env var (api_key_env),
# never inlined.
llm:
  provider: openai-compatible
  base_url: http://localhost:11434/v1
  model: qwen3:32b
# Kani bounds for the category-1 ensemble (#117). REQ030's harness folds over a length-3
# `ProofEnsemble`, so every loop exits by the fourth iteration — `default_unwind: 4` is the
# tightest bound that discharges the unwinding assertions (verified: 0/513 checks fail in ~4s).
# Without it CBMC unwinds those iterators unbounded and never returns; the timeout is the backstop
# so a future claim that blows up is cut off instead of running for hours.
kani:
  default_unwind: 4
  timeout_seconds: 300
# Per-requirement cat-1 code root (#483). REQ051's readiness property is proved over the payload-free
# core in `crates/provreq-proofs`, which Creusot can compile whole — the app crate cannot (its ~96
# `#[derive(PartialEq)]` types trip Creusot's `DeepModel` demand, #531). `engine::is_ready` delegates
# to that crate, so the proof is about the readiness provreq actually reports. Kani and Creusot both
# run against it; every non-code world still resolves against the subject.
verify:
  crates:
    REQ011: crates/provreq-proofs
    REQ024: crates/provreq-proofs
    REQ028: crates/provreq-proofs
    REQ051: crates/provreq-proofs
