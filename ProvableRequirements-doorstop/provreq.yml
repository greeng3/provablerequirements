schema: 1
subject_requirements: requirements-doorstop
documents:
- prefix: REQ
  path: .
# The environment a verdict was proved in (REQ049) — the operator's own stable label, so a
# container rebuild does not read as a changed environment the way a hostname would.
environment: provreq-devcontainer
# Triage's bulk pre-sort provider (REQ012). Pointed at a local Ollama, which is the portable
# default; point base_url at whatever endpoint you actually run. A keyless endpoint needs no
# credential, and an API key would be named here by env var (api_key_env), never inlined.
llm:
  provider: openai-compatible
  base_url: http://localhost:11434/v1
  model: qwen3:32b
