---
# yamllint configuration for `make lint-yaml`.
extends: default

rules:
  line-length:
    max: 100
    level: warning
  # Doorstop and many tool configs omit the leading `---`.
  document-start: disable
  truthy:
    level: warning

# Never lint outside this repo or into generated / tool-managed trees.
ignore: |
  qrusty/
  requirements-doorstop/
  # Written by provreq, not by hand: every over-length line is one YAML scalar holding an
  # engine's own explanation, so it can be neither wrapped nor shortened, and the next run
  # rewrites the file regardless.
  ProvableRequirements-doorstop/verdicts.yml
  .venv/
  node_modules/
  .claude/
  .claude-home/
