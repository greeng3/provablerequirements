<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>provreq — UI not built</title>
    <!--
      The committed placeholder. `rust-embed` requires web/dist to exist at compile time, so this
      file is what lets a bare `cargo build` compile without Node. It deliberately references NO
      assets: the hashed bundle is gitignored, so any asset link here would 404 in a fresh clone
      and serve a blank page that looks like a broken app rather than an unbuilt one.

      `npm --prefix web run build` overwrites this with the real UI. Do not commit that output.
    -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #fbfaf7;
        color: #11201f;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 46ch;
        padding: 2rem;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1rem;
        color: #3d514f;
      }
      code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.9em;
        background: #fff;
        border: 1px solid #dfe3e0;
        border-radius: 3px;
        padding: 0.1em 0.4em;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0c1615;
          color: #e7efed;
        }
        p {
          color: #a9bbb8;
        }
        code {
          background: #131f1e;
          border-color: #253634;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The provreq UI has not been built</h1>
      <p>
        This binary was compiled without the frontend bundle, so there is no UI to serve. The
        backend API is unaffected and still responds.
      </p>
      <p>Build the UI, then rebuild:</p>
      <p><code>npm --prefix web ci &amp;&amp; npm --prefix web run build</code></p>
    </main>
  </body>
</html>
