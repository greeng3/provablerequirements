text: |
  Where a claim already ranges over a variable of a boolean domain, that variable can be stated as a
  condition of the claim directly. Requiring instead that every condition be a named predicate of the
  subject leaves a whole class of requirement unsayable: the ones relating what goes *into* an
  operation to what comes out of it, where the deciding condition is an input rather than a property
  the subject separately declares.

  The consequence of leaving it unsayable is not that such requirements go unwritten. It is that they
  get written as something else — a nearby proposition that can be named, standing in for the one
  meant. That substitute may be false of the thing under check while looking entirely reasonable, so
  what is verified is not what was required, and the verdict is sound about the wrong claim. A
  formalization that cannot say what is meant is more dangerous than one that refuses.

  The reading is deliberately narrow, so that admitting it takes nothing away:

  - it applies only to a name used with no arguments, since anything applied to terms is an
    application;
  - a name the vocabulary declares is a predicate, always, so nothing that was checkable before
    changes meaning;
  - a name the claim does not range over is undeclared, as it was, so a misspelling is still caught.

  Whether the variable's domain is boolean is a question about types, which name resolution cannot
  answer and must not pretend to. It is settled where the domain's real type is known, against the
  subject — and a variable whose domain is not boolean is refused there with that reason, rather than
  emitted for the checker to reject as a malformed artifact. A checker's complaint about generated
  text is not an answer about the claim.

  What surfaces to the operator for confirmation must distinguish a variable used as a condition from
  a predicate of the same name, since the two read identically otherwise, and confirming the wrong one
  is exactly the failure that confirmation step exists to prevent.
