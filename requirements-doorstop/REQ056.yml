text: |
  Where the tool knows what an operator was reaching for, it says so. Reporting that an input was
  rejected without naming the accepted form leaves the operator to rediscover a rule the tool
  already applied, and a usage summary that lists an option group does not name the one option in
  it that was wanted.

  The case here is a command's positional argument. The positional slot holds the command's own
  primary subject, so it carries the repository where that is the subject and an identifier where
  that is, and the repository moves to a named flag. The rule is consistent, but it is not
  self-evident from any single command, and a habit formed on one shape carries into the other.

  Where a rejected argument can be recognised as the input the operator meant to give, the tool
  therefore names the form that would have been accepted, in terms of what they actually typed.
  This recognition is deliberately narrow: it applies only where the input is unmistakably of the
  kind in question, because a confident suggestion attached to an unrelated failure is worse than
  no suggestion at all. Where nothing can be recognised, the tool reports the rejection plainly and
  adds nothing.
