text: |
  A category-2a grounding binds a requirement's vocabulary to a model, not to the subject's
  own code. The model is a TLA+ specification the operator wrote, and a 2a binding names a
  definition in it: an operator definition, a declared variable, or a declared constant. The
  binding resolves when exactly one definition of that name exists in the subject's TLA+.

  Predicates and sorts alike resolve through one model resolver, because TLA+ does not
  distinguish an action from a state operator from a data set at the name level; every one is
  a named definition. This is unlike the code world, where a predicate binds to a function
  and a sort to a type and the two must never cross-resolve.

  A symbol that resolves to no definition, or to several, does not ground: an unresolved
  binding parks the requirement exactly as in the code world, and an ambiguous name is never
  silently resolved to one of its candidates. A category-2a requirement grounds only when
  every symbol it speaks of resolves to a definition in the model.

  A model binding establishes that the definition exists and that it takes the number of
  arguments the requirement applies the symbol to. A definition of the wrong arity does not
  ground: it is refused where the binding is, not left to the engine.

  Arity was once deferred here on the reasoning that it belonged to the engine, as
  instantiability does for a code-world sort. Running it proved otherwise. A definition named
  at the wrong arity cannot be checked at all — the generated specification does not survive
  the model checker's own analysis — so the engine has no verdict to offer, only a complaint
  about a module the tool generated and has already removed by the time anyone reads it. That
  is a report the operator cannot act on, about a file they never wrote, for a mistake sitting
  in their binding. The deferral rested on arity being a question of the checking language;
  in the specification language an operator's arity is part of its definition, and the
  declaration is already in hand when the binding resolves.

  The check is held to what the specification actually states. A declaration names a value and
  takes no arguments; an operator takes what its parameter list holds; a function definition
  takes none as an operator, because it is applied by subscript rather than by argument list.
  Where a line does not state an arity, nothing is claimed and the binding stands on its other
  checks — a binding wrongly parked costs the operator more than the check saves them. Where
  several definitions share the name, the ambiguity is reported first: until it is known which
  definition is meant, there is no arity to be right or wrong about.

  Return shape remains a question for the engine, and stays deferred. The resolution is a
  structural read of the specification, not a full parse, so a name introduced only by a local
  binding or an imported module is not seen; a resolved binding reports what was checked and
  what was not, rather than implying more was checked.

  Where the model lives is the operator's choice, not the tool's. Specifications are found under
  the subject, and also under any locations the subject's configuration names; a team whose model
  lives in a sibling repository or a shared directory can ground a model requirement without
  moving it. A location resolves relative to the subject, since what is being described is where
  the model sits relative to the thing being verified. A configured location that does not exist
  contributes no specifications, and the requirement parks as it would for any name the model does
  not define.

  A specification outside the subject carries two obligations the tool must meet, and both are
  properties of a verdict rather than conveniences.

  The first is provenance. A verdict records what it was proved against, and the subject's own
  revision does not cover a file outside the subject: such a file can change without any recorded
  anchor moving, leaving a verdict that reports itself as current while the model it was checked
  against has since changed. So the specifications outside the subject are themselves part of what
  a verdict is anchored to, and one of them changing makes that verdict stale with a reason saying
  so. Where every specification is inside the subject this adds nothing — the subject's own
  revision already covers them, and the same drift must not be reported twice.

  The second is that the tool writes nothing where the model lives. A configured location may be a
  repository the operator did not offer for writing, or one the tool cannot write to at all. The
  generated module and its configuration are therefore produced in the tool's own scratch space
  and the model checker is directed to the specification, rather than the generated files being
  placed beside it. The subject's tree and every configured location are only ever read.
