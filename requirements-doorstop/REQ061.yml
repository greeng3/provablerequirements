text: |
  What is generated for a checker must name the subject's items the way that checker will read them.
  A name is not a bare identifier: a language places items within a structure, and the same
  identifier in two places is two different items. Generating a name that omits where the item sits
  produces an artifact that cannot be built, which reaches the operator as an inconclusive verdict
  carrying a tool error — the failure that checking a binding early exists to prevent.

  Where an item sits is something the tool already learns when it resolves a binding: it finds the
  item at a location, and the location determines the name. That fact is therefore recorded with the
  location and used wherever a name is generated, rather than reconstructed by convention at the
  point of generation. Each named thing carries its own placement: two items used in one generated
  expression need not sit together, and assuming they do is correct only by coincidence.

  Some items cannot be named from a generated artifact at all — they belong to a separately built
  unit, or to one that cannot be consumed as a library. Existence and reachability are distinct
  questions, and confirming the first does not answer the second: a binding to such an item still
  resolves, because the item genuinely is where the tool says it is, and the operator's confirmation
  of that is not made false by what a checker can reach. Generation is where the distinction is
  enforced, and there the response is to decline and name the file, never to emit a name the tool
  invented in the hope it resolves.

  Where two declarations of the same name would each be reachable by a different name, that is an
  ambiguity for the operator to settle, exactly as any other duplicate is. Pooling what they declare
  would describe a thing that exists in neither place.
