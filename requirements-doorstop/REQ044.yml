text: |
  The living loop tallies how many stored verdicts have drifted (REQ043), but acting on that tally
  still meant opening each drifted item and re-verifying it one at a time. When several verdicts have
  gone stale at once — a subject commit moved, the tool was upgraded — that is tedious and easy to
  leave half-done.

  The operator surface offers a single action to re-verify every drifted verdict at once, shown only
  when at least one is stale. It re-runs verification on each drifted item and then refreshes the
  coverage funnel, so the stale count falls and the verified count rises as results settle. Fresh
  verdicts are never re-run — only the drifted set the living loop already identified. The action
  reports its progress while it runs, and one item failing to verify does not abort the rest: every
  failure is surfaced together once the sweep completes.
