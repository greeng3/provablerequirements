text: |
  A subject repository contains more than the source its author wrote. Build outputs, fetched
  dependencies, and version-control metadata live in the same tree, are frequently far larger than
  the source, and are regenerable rather than authored. What the tool reads of a subject must be the
  subject's own source, and every part of the tool that reads it must agree on where that ends.

  Directories holding regenerable or vendored content are therefore excluded from every walk of a
  subject, by one shared rule rather than a rule per traversal. Separate traversals with separate
  opinions about which files count is a disagreement that shows up as inconsistent answers about the
  same repository.

  The exclusion is not only a matter of speed, though the difference is large enough to be felt on
  an ordinary repository. A binding resolves against what the subject declares, and a name occurring
  in generated or vendored content is not a declaration the author made; treating it as one turns a
  correct binding into an ambiguity against a file the operator never wrote.

  Exclusion recognises both what such directories are conventionally named and how they mark
  themselves, since neither alone is sufficient: some carry no marker, and some are placed by
  configuration where no name-based rule could anticipate them. Where the evidence is absent or
  unreadable, the directory is walked — wrongly excluding a directory silently narrows what every
  binding can resolve against, which is the more damaging of the two errors.

  Not everything in the tree the author did not write is regenerable. An operating system leaves
  records of its own among the source: how a folder was last displayed, or a sidecar carrying the
  metadata of the file beside it. The sidecar is the harder case, because it is named after the file
  it shadows and carries that file's extension, so any rule recognising source by extension admits
  it. Such records are excluded on the same footing, and by the same shared rule, so that a
  traversal reading files and a traversal reading directories cannot hold different views of where
  the subject's source ends.

  A file the author did write is read whatever it is named. Being inconspicuously named is not
  evidence of being unauthored — a subject's own configuration is routinely named that way — and
  excluding a file wrongly narrows what every binding can resolve against exactly as excluding a
  directory wrongly does.
