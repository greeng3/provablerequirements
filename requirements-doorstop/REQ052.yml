text: |
  A judgement the model failed to make is not a judgement. Where the tool delegates a
  classification to a language model, the reply either carries assignments the tool can read or it
  does not, and a reply that yields no usable assignment at all — a refusal, prose where a list was
  asked for, a truncated or malformed answer, an empty response — is a failed request. Presenting
  it as a result attributes to the model an opinion it never expressed, and does so in the one
  place the operator has no way to check: a bucket per item, complete, with a model's name above
  it.

  The danger is specific to a default that looks conservative and is not. An omitted item has to
  fall back to something, and the fallback must be a state that claims nothing — which rules out
  every triage bucket, because each of them is an assertion. The bucket meaning *this will not be
  formalized* is the sharpest case: it is a lifecycle claim about what the operator intends, kept
  distinct from un-triaged for exactly that reason, and an item defaulted into it is not recorded
  as unjudged but as judged unformalizable. It also leaves the un-triaged count, so the work still
  owed stops being visible in the one report built to show what is owed. Applied to a whole backlog
  because nothing parsed, the same fallback becomes a fabricated classification, indistinguishable
  from a model that read every requirement and judged them all unformalizable.

  The floor is therefore the absence of a classification, not the most conservative one. Where some
  items are classified and others are omitted, the omitted ones stay un-triaged and keep counting
  as work outstanding. Where the reply yields nothing usable, the tool reports the failure, leaves
  existing classifications untouched, and treats the run as it treats any other failed request — no
  state is written on the strength of an answer that was never received.

  What the model is asked matters as much as what is done with silence. A classification is only
  worth recording if the question put to the model is the question the bucket answers: whether the
  claim can be lowered to something an engine can check. A prompt that names the buckets and leaves
  their meaning to be inferred invites a sort on surface phrasing — whether a requirement mentions a
  command, an interface, a release — which is a different question with a plausible-looking answer.
  Where the tool knows what each category can actually express, it says so.
