text: |
  The `triage` command classifies each requirement item into one of
  formalizable-now, falsifiable-only, or stays-prose, and persists the result as
  mutable companion state keyed by the source item id. Classification is advisory
  and freely re-triageable: seeding fills only items that have no entry yet and
  never overwrites an operator's choice, while an explicit set overrides one
  item's bucket. Re-classification replaces the classifier's own judgements, and
  likewise never an operator's choice: a hand-set classification is changed only
  by another explicit set, whatever flags a run was given, and a run that keeps
  hand-set entries says which ones it kept. The classifier is pluggable; the
  default seeds from the source's verification hint when present and otherwise
  defaults to stays-prose, never over-claiming that an item is formalizable.
  Before any classifier is asked, the companion record answers for itself: an
  item carrying a stored verdict or an admitted formalization has demonstrably
  been lowered already, so it is recorded as formalizable-now, marked as
  demonstrated by the record rather than judged, and kept out of the
  classifier's batch — including on a re-classification, which replaces
  judgements and finds none here. A run that keeps such entries says so
  separately from the hand-set ones it keeps, and an operator's own choice
  still outranks a demonstration.
