text: |
  Work the tool asks an external service to do is divided so that a failure costs a bounded part of
  it and never all of it. A single request covering an entire backlog has the property that its cost
  grows with the size of the input, while the bound on it does not: the same limit that is generous
  for one small request is not a limit anyone can reason about for a large one. Such a request also
  fails as a unit, so an operator who waits through it and loses it must pay for the whole thing
  again from nothing.

  This matters most where it is least visible. A bulk operation exists to save effort on a large
  backlog, so it is the large backlog — the case the feature is for — where an undivided request is
  worst: slowest, most likely to exceed any bound, and most expensive to lose.

  The tool therefore divides such work into batches, records the result of each batch before asking
  for the next, and reports progress as batches complete, so that a long run is distinguishable from
  a hung one. Where a run stops early it says what was and was not completed, leaves the remainder
  honestly unclassified rather than defaulting it, and resumes from what it recorded when it is run
  again. The size of a batch is the operator's to set, because it is the unit their own endpoint's
  speed determines.
