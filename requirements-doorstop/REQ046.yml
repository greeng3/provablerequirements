text: |
  Engine detection reports what is present but never installs anything (R-eng-2, detect half). The
  Design C decision commits to the install half for the light tier of engines — those with a clean,
  scripted, per-platform recipe — while the heavy tier stays dev-container-first. The tool provisions
  a light-tier engine natively into the operator's dev environment, consent-gated, and confirms the
  result by re-detecting rather than by trusting that a file landed.

  The install is gated on explicit consent: absent consent, the tool prints the concrete plan — what
  it would download, from where, and to which location — and stops without changing anything. With
  consent, it fetches the pinned artifact into a tool-owned data directory that the detector also
  reads, so the installer and the detector agree on one location, then re-detects and reports either
  a confirmed availability or a specific, honest failure.

  Provisioning is best-effort with graceful degradation and never installs system prerequisites on
  the operator's behalf. A missing runtime the engine depends on, an engine with no native recipe, or
  a download that does not yield a usable engine each narrow the available capability and are surfaced
  plainly; none of them fail the tool. An engine outside the light tier is reported as having no
  native recipe yet, directing the operator to the dev-container path rather than attempting a
  half-built install.
