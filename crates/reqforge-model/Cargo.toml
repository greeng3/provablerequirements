[package]
name = "reqforge-model"
version = "0.1.0"
# Edition 2024, matching ReqForge's own workspace. provreq is on 2021, and a workspace is free to
# mix editions per crate — pinning this to what the code was written and tested against is the
# whole point of taking it as a crate rather than pasting it into `src/`.
edition = "2024"
description = "ReqForge's artifact model, storage, and schema migration (absorbed — see docs/absorbing-reqforge.md)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greeng3/provablerequirements"
publish = false

# Versions taken from ReqForge's own workspace manifest rather than chosen here, so this crate is
# built against what its 766 tests were proven against. `preserve_order` is load-bearing and not a
# preference: an artifact read and written back must keep its JSON key order, or every round-trip
# through provreq would reorder a file the operator has to review.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = [
    "std",
    "clock",
    "serde",
] }
thiserror = "2"
# Doorstop's on-disk item format is YAML; the importer (`doorstop`) reads it. Pinned to ReqForge's
# own `=0.9` — deprecated and unmaintained, but it is the format of an external tool we import from,
# not a format we choose, so a permanent import boundary is exactly where a frozen parser belongs.
serde_yaml = "=0.9"
# `write::ownership` logs through it. Keeping their instrumentation rather than deleting it in
# transit: this crate is their code moved, and a change made in transit is a change to code whose
# tests were written elsewhere.
tracing = "0.1"
sha2 = "0.11"
# Not a dev-dependency: `write::atomic` writes through a named temporary so a torn write can never
# leave a half-parsed artifact on disk.
tempfile = "3"
# Full-text search index (`search`), rebuilt in memory alongside the UUID index inside
# `world::run_discovery`. Pinned to ReqForge's own `=0.24` — the reports/search cluster was written
# and tested against it (#331/#348). Pulled in with `World` (its `search_index` field) rather than
# feature-gated: provreq ships one binary that embeds the UI, so a search-free build buys nothing.
tantivy = "=0.24"
# CSV export view (`exports::csv`). Matches ReqForge's own `csv = "1"` spec — the one external dep the
# reports/data cluster adds beyond search (slice 4, #331/#354).
csv = "1"
# The leaf utils (arc-2 slice 1, #358): `thumbnails` spawns blocking generation on tokio and
# coalesces in-flight requests with a DashMap; `urls` checks URL status over reqwest. Pinned to
# ReqForge's own specs. tokio `full` matches its workspace pin (the http/ absorb needs it anyway);
# reqwest features match provreq's own 0.13 pin (slice 0, #356).
tokio = { version = "1", features = ["full"] }
dashmap = "6"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
    "json",
] }
# `git_history` reads an artifact file's commit log through gix. Pinned to ReqForge's own `=0.86`
# spec and feature set (blob-diff for path-touch detection, revision walking, sha1).
gix = { version = "0.86", default-features = false, features = [
    "blob-diff",
    "revision",
    "max-performance-safe",
    "sha1",
] }
# `diff` renders a text diff between two revisions of an artifact (arc-2 slice 2, #360). Matches
# ReqForge's own `similar = "3"` spec.
similar = "3"
# The LLM adapter layer (`llm`, arc-2 slice 3a, #362) parses/validates provider endpoints. Matches
# ReqForge's own `url = "2"` spec.
url = "2"
