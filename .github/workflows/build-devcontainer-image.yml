# Build the devcontainer image once per arch and publish a multi-arch tag to GHCR, so the
# heavy stages in .devcontainer/Dockerfile (Kani setup, the Prusti source build) are paid
# ONCE in CI and never again on a developer's machine — devcontainer.json then pulls this
# image instead of building the Dockerfile.
#
# Native runners per arch (NOT QEMU): the Prusti source build under emulation would take many
# hours. ubuntu-latest is amd64; ubuntu-24.04-arm is a free arm64 hosted runner on public
# repos. Each leg pushes by DIGEST (no tag), then the `merge` job assembles one manifest list
# tagged :latest and :<sha> from the two digests — the standard docker multi-arch pattern.
#
# Prerequisite: the base image (greeng340or/rust-dev-ubuntu) must provide BOTH linux/amd64 and
# linux/arm64, or the corresponding leg fails at FROM.
name: Build devcontainer image

"on":
  workflow_dispatch:
    inputs:
      # The tag to publish. Defaults to `latest` (the shared image everything pulls), so a manual
      # run with no input behaves exactly like the push trigger. Set a scoped tag (e.g. `pr-153`)
      # to build a throwaway image for validating an unmerged branch WITHOUT overwriting `latest`.
      image_tag:
        description: "Published tag (default: latest)"
        required: false
        default: "latest"
  # Refresh the image when an INPUT to the image changes on main (rare; it's a long build).
  # Deliberately NOT .devcontainer/**: devcontainer.json, the README, and anything else in that
  # directory are consumed by the editor, not baked in, so matching them would spend 1-2 hours
  # rebuilding an image whose contents did not change. The inputs are:
  #   - the Dockerfile itself;
  #   - patches/, which the Dockerfile COPYs and applies to third-party sources it builds (see
  #     the Creusot stage). A patch edit changes what lands in the image just as surely as a
  #     Dockerfile edit does, so omitting it here would leave a silently stale image.
  push:
    branches: [main]
    paths:
      - ".devcontainer/Dockerfile"
      - ".devcontainer/patches/**"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/provreq-devcontainer

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: >-
            type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            $(printf "${IMAGE}@sha256:%s " *)
        env:
          # `inputs` is empty on a push event, so this is `latest` there — identical to before.
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
      - name: Show the published manifest
        run: docker buildx imagetools inspect "${IMAGE}:${IMAGE_TAG}"
        env:
          IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}

      # Close the loop on #549's digest pin: devcontainer.json references the image by digest, so a
      # Dockerfile change only reaches developers once that digest is bumped to the republished
      # image. Do it automatically — resolve the just-published multi-arch index digest and open a
      # PR pinning devcontainer.json to it. Only for `latest`: a scoped workflow_dispatch tag (e.g.
      # pr-153) is a throwaway validation image and must not move the shared pin. The edit touches
      # only devcontainer.json, which the `push` paths filter excludes, so merging the PR does not
      # re-trigger this workflow — no loop.
      - name: Resolve published index digest
        if: ${{ (inputs.image_tag || 'latest') == 'latest' }}
        id: idx
        run: |
          d=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{.Manifest.Digest}}')
          echo "digest=$d" >> "$GITHUB_OUTPUT"
      - name: Check out the repo
        if: ${{ (inputs.image_tag || 'latest') == 'latest' }}
        uses: actions/checkout@v5
      - name: Pin devcontainer.json to the new digest
        if: ${{ (inputs.image_tag || 'latest') == 'latest' }}
        env:
          DIGEST: ${{ steps.idx.outputs.digest }}
        run: |
          python3 - "$IMAGE" "$DIGEST" <<'PY'
          import re, sys
          image, digest = sys.argv[1], sys.argv[2]
          path = ".devcontainer/devcontainer.json"
          src = open(path).read()
          # Replace the image reference (whether pinned by @sha256:... or by a :tag) in place.
          new = re.sub(re.escape(image) + r"(@sha256:[0-9a-f]+|:[\w.\-]+)",
                       f"{image}@{digest}", src, count=1)
          if new == src:
              raise SystemExit(f"no {image} reference found in {path}")
          open(path, "w").write(new)
          PY
      - name: Open the digest-bump PR
        if: ${{ (inputs.image_tag || 'latest') == 'latest' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/devcontainer-digest
          base: main
          title: "chore: bump devcontainer image digest"
          commit-message: "chore: bump devcontainer image digest to the republished image"
          body: |
            Automated by `build-devcontainer-image.yml` after it republished the devcontainer image.

            Pins `.devcontainer/devcontainer.json` to the new multi-arch index digest so a rebuild
            pulls the image this Dockerfile change produced (closes the loop on #549 / #550). Merge
            to roll developers onto the new image.
          assignees: greeng3
          delete-branch: true
