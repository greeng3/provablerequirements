# provreq is both the root package and the workspace root. The second member arrived with phase 2
# of the ReqForge absorb (#305): its artifact model is taken as a crate rather than pasted into
# `src/`, so its own tests come along unchanged and the boundary between their code and ours stays
# visible after the second edit.
[workspace]
members = ["crates/reqforge-model"]

[package]
name = "provreq"
version = "0.0.7"
edition = "2021"
description = "PRL native provisioner and backend server (Design C)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/greeng3/provablerequirements"

[[bin]]
name = "provreq"
path = "src/main.rs"

[lib]
name = "provreq"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
rust-embed = "8"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The category-1 adapter resolves a PRL predicate to a real item in the subject's Rust
# (REQ025). Both crates were already in Cargo.lock transitively (serde derive), so this
# promotes them to direct deps rather than adding weight. `span-locations` is what makes
# a resolved predicate reportable as file:line — without it syn spans carry no line.
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# The category-2a engine (TLC, REQ029) redirects TLC's scratch (`states/`) to a throwaway
# metadir outside the subject, so `run` needs tempfile at runtime, not just in tests. Already
# in Cargo.lock as a dev-dep, so this promotes it rather than adding weight.
tempfile = "3"
# `cargo creusot` refuses any subject that does not depend on `creusot-std` — the refusal comes
# from cargo-creusot itself, so this is what makes provreq verifiable by its own Creusot engine
# rather than a dependency provreq's code uses. Measured inert on a stable build: it and its
# transitive crates are pure Rust with no nightly-only requirement, so the release matrix is
# unaffected and `#[logic]`/`proof_assert!` remain available only under `cfg(creusot)`.
# Locked to `ARG CREUSOT_TAG` in `.devcontainer/Dockerfile` — cargo-creusot refuses a mismatched
# pair outright. `creusot_std_moves_in_lockstep_with_the_installed_tag` fails if they drift.
creusot-std = "0.13"
sha2 = "0.11"
reqforge-model = { version = "0.1.0", path = "crates/reqforge-model" }
# The ReqForge adapter writes provenance back as a review-log entry, whose `timestamp` is a
# `chrono::DateTime<Utc>` for the ReqForge review-log back-write (REQ020) and `Utc::now()` for the
# migrate-doorstop timestamps (#317). Already in the tree via reqforge-model, so cargo unifies
# rather than adding weight.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# Minting a fresh artifact uuid when authoring a requirement (`provreq new`, #325). v7 is
# time-ordered, the id scheme ReqForge artifacts use. Already in the tree via reqforge-model.
uuid = { version = "1", features = ["v7"] }

# `cfg(kani)` is set only by `cargo kani`, so an ordinary build has to be told it is a real cfg —
# otherwise the `kani::Arbitrary` impl in src/engine.rs trips `unexpected_cfgs` under
# `clippy -- -D warnings`. Declaring it is the whole fix; the impl stays inert off Kani.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# cargo-dist / release configuration is expressed in the CI workflow
# (.github/workflows/release.yml) for this prototype; see docs/build-and-release.md.
